# Reference copy. `sudo xgm-egpu install-rules` writes this for you.
#
# The NVIDIA driver has its own runtime power management that suspends the GPU
# into D3cold independently of the PCI core's. That is a second, separate route
# to the same "GPU has fallen off the bus" (Xid 79) failure, so pinning
# power/control=on via udev is not sufficient on its own.

options nvidia NVreg_DynamicPowerManagement=0
